<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>20x</title>
    <script>
      // Pre-paint theme resolution — avoids a flash of the wrong theme before React mounts.
      (function () {
        try {
          var m = localStorage.getItem("ui-theme") || "dark";
          var dark = m === "dark" || (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
          var storedGlass = localStorage.getItem("ui-glass-opacity");
          if (storedGlass !== null) {
            var glass = Math.max(40, Math.min(100, Math.round(Number(storedGlass))));
            if (Number.isFinite(glass)) {
              var progress = Math.max(0, (glass - 55) / 45);
              root.style.setProperty("--glass-opacity", glass + "%");
              root.style.setProperty("--glass-solid-mix", Math.pow(progress, 3) * 100 + "%");
              root.style.setProperty("--glass-blur-factor", String(1 - progress));
              root.style.setProperty("--glass-popover-alpha", String(Math.min(1, .84 + (glass - 55) * .0015)));
              root.classList.toggle("glass-solid-mode", glass === 100);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
