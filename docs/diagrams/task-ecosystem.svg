<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc">
  <title id="title">20x connects task sources, coding harnesses, and context</title>
  <desc id="desc">Task source logos: Linear, GitHub Issues, HubSpot, Notion, GitLab, YouTrack, Peakflo Workflo, and manual entry. Their tasks enter the 20x workspace. Harness logos: Claude Code, OpenCode, Codex, Cursor, Pi, and ACP for additional compatible agents. Repositories, skills, MCP servers, and browser panels provide context.</desc>
