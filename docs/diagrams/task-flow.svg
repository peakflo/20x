<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
  <title id="title">You decide the outcome; 20x handles the work</title>
  <desc id="desc">Your responsibilities are to define the outcome, approve consequential actions when asked, and review the result. 20x plans subtasks with Mastermind, proposes setup with triage, runs agents, and keeps task, canvas, browser, and results together.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
    <filter id="shadow" x="-8%" y="-15%" width="116%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173761" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#477dd2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .ink{fill:#14233d}.muted{fill:#5a6b84}.blue{fill:#2064c7}
      .eyebrow{font-size:14px;font-weight:750;letter-spacing:.1em}
      .title{font-size:36px;font-weight:750}
      .panel-title{font-size:23px;font-weight:750}
      .item{font-size:19px;font-weight:600}
      .detail{font-size:16px}
    </style>
  </defs>
  <rect width="1200" height="525" rx="28" fill="url(#background)"/>
  <rect x="28" y="28" width="1144" height="469" rx="24" fill="#fff" opacity=".5" stroke="#dbe6f5"/>
  <text x="60" y="74" class="eyebrow blue">THE HANDOFF</text>
  <text x="60" y="120" class="title ink">You decide the outcome. 20x handles the work.</text>
  <text x="60" y="153" class="muted" style="font-size:18px">Keep your judgment for the moments that need it.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="184" width="366" height="273" rx="21" fill="#fff" stroke="#cad8eb"/>
    <rect x="492" y="184" width="648" height="273" rx="21" fill="#eaf2ff" stroke="#b5cdf7"/>
  </g>
  <rect x="82" y="207" width="65" height="32" rx="10" fill="#e8edf5"/>
  <text x="114.5" y="229" text-anchor="middle" class="eyebrow ink">YOU</text>
  <text x="82" y="272" class="panel-title ink">Make the calls that matter</text>
  <circle cx="92" cy="313" r="5" fill="#21385e"/>
  <text x="109" y="319" class="item ink">Set the outcome</text>
  <circle cx="92" cy="363" r="5" fill="#21385e"/>
  <text x="109" y="369" class="item ink">Approve when needed</text>
  <text x="109" y="391" class="detail muted">For consequential actions</text>
  <circle cx="92" cy="425" r="5" fill="#21385e"/>
  <text x="109" y="431" class="item ink">Review and give feedback</text>

  <path d="M437 320 H477" fill="none" stroke="#477dd2" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="516" y="207" width="65" height="32" rx="10" fill="#2568ce"/>
  <text x="548.5" y="229" text-anchor="middle" fill="#fff" class="eyebrow">20x</text>
  <text x="516" y="272" class="panel-title ink">Carry the repeated decisions and context</text>
  <g fill="#fff" stroke="#c8daf9">
    <rect x="516" y="290" width="287" height="61" rx="13"/>
    <rect x="820" y="290" width="296" height="61" rx="13"/>
    <rect x="516" y="365" width="287" height="61" rx="13"/>
    <rect x="820" y="365" width="296" height="61" rx="13"/>
  </g>
  <text x="532" y="315" class="item ink">Mastermind plans</text>
  <text x="532" y="337" class="detail muted">Subtasks and next steps</text>
  <text x="836" y="315" class="item ink">Triage proposes setup</text>
  <text x="836" y="337" class="detail muted">Priority, harness, skills, repo</text>
  <text x="532" y="390" class="item ink">Agents do the work</text>
  <text x="532" y="412" class="detail muted">One task, linked work log</text>
  <text x="836" y="390" class="item ink">Canvas holds context</text>
  <text x="836" y="412" class="detail muted">Subtasks, browser, result</text>
  <text x="60" y="488" class="detail muted">The brief, work, and outcome stay attached to the task.</text>
</svg>
