name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 is built, signed and notarized on Intel, but stapled by the
          # staple-mac-x64 job on Apple silicon: stapler on macos-15-intel can't
          # reliably reach api.apple-cloudkit.com (Error 68,
          # https://github.com/actions/runner-images/issues/14924).
          - arch: x64
            runner: macos-15-intel
            staple: false
          - arch: arm64
            runner: macos-14
            staple: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          TELEMETRY_ENABLED: ${{ vars.TELEMETRY_ENABLED }}
          TELEMETRY_FLUSH_BATCH_SIZE: ${{ vars.TELEMETRY_FLUSH_BATCH_SIZE }}
          TELEMETRY_MAX_BUFFERED_EVENTS: ${{ vars.TELEMETRY_MAX_BUFFERED_EVENTS }}
        run: pnpm build

      - name: Validate signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Import Apple Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Inspect signing identities
        run: |
          security find-identity -v -p codesigning
          security list-keychains

      - name: Package for macOS
        env:
          DEBUG: electron-builder,electron-notarize*
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --config ./scripts/electron-builder-ci-mac-config.js --mac --${{ matrix.arch }} --publish never

      - name: Resolve mac artifacts
        id: mac-artifacts
        run: |
          APP_PATH="$(find dist -maxdepth 2 -type d -name '20x.app' | head -n 1)"
          ZIP_PATH="$(find dist -maxdepth 1 -type f -name '20x-*-${{ matrix.arch }}.zip' | head -n 1)"
          DMG_PATH="$(find dist -maxdepth 1 -type f -name '20x-*-${{ matrix.arch }}.dmg' | head -n 1)"

          test -n "$APP_PATH"
          test -f "$ZIP_PATH"
          test -f "$DMG_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Inspect packaged outputs
        run: |
          ls -lah dist
          ls -lah "${{ steps.mac-artifacts.outputs.app_path }}"
          echo "ZIP: ${{ steps.mac-artifacts.outputs.zip_path }}"
          echo "DMG: ${{ steps.mac-artifacts.outputs.dmg_path }}"

      - name: Notarize mac ZIP and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Retries notarytool/stapler calls: Apple's ticket CDN sometimes drops
        # the connection right after a submission is Accepted (stapler Error 68).
        run: |
          if [ "${{ matrix.staple }}" = "true" ]; then
            mode=(--assess)
          else
            mode=(--notarize-only)
          fi
          ./scripts/ci-notarize-staple.sh \
            "${{ steps.mac-artifacts.outputs.zip_path }}" \
            "${{ steps.mac-artifacts.outputs.app_path }}" \
            "${mode[@]}"

      - name: Notarize and staple mac DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mode=()
          if [ "${{ matrix.staple }}" != "true" ]; then
            mode=(--notarize-only)
          fi
          ./scripts/ci-notarize-staple.sh \
            "${{ steps.mac-artifacts.outputs.dmg_path }}" \
            "${{ steps.mac-artifacts.outputs.dmg_path }}" \
            "${mode[@]}"

      # Unstapled x64 builds go to staple-mac-x64; nothing is published from here.
      - name: Upload notarized x64 build for stapling
        if: ${{ !matrix.staple }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-notarized
          path: |
            dist/20x-*-${{ matrix.arch }}.zip
            dist/20x-*-${{ matrix.arch }}.dmg
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      # Stapling appends the ticket to the DMG, so the sha512/size that
      # electron-builder wrote into latest-mac.yml must be recomputed.
      - name: Refresh update manifest after stapling
        if: ${{ matrix.staple }}
        run: python3 scripts/ci-refresh-mac-manifest.py dist/latest-mac.yml "${{ steps.mac-artifacts.outputs.dmg_path }}"

      - name: Rename arch-specific update manifest
        if: ${{ matrix.staple }}
        run: cp dist/latest-mac.yml dist/latest-mac-${{ matrix.arch }}.yml

      - name: Create stable asset names
        if: ${{ matrix.staple }}
        run: |
          cp dist/20x-*-${{ matrix.arch }}.dmg dist/20x-mac-${{ matrix.arch }}.dmg
          cp dist/20x-*-${{ matrix.arch }}.zip dist/20x-mac-${{ matrix.arch }}.zip

      - name: Upload release assets directly
        if: ${{ matrix.staple }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap

      - name: Upload manifest artifact
        if: ${{ matrix.staple }}
        uses: actions/upload-artifact@v4
        with:
          name: manifest-mac-${{ matrix.arch }}
          path: dist/latest-mac-${{ matrix.arch }}.yml

  # Staples the x64 build notarized by build-mac on Apple silicon, then publishes
  # it. stapler only reads the code signature and fetches the ticket, so it works
  # on x86_64 bundles from an arm64 host.
  staple-mac-x64:
    needs: build-mac
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download notarized x64 build
        uses: actions/download-artifact@v4
        with:
          name: mac-x64-notarized
          path: dist

      - name: Resolve mac artifacts
        id: mac-artifacts
        run: |
          ZIP_PATH="$(find dist -maxdepth 1 -type f -name '20x-*-x64.zip' | head -n 1)"
          DMG_PATH="$(find dist -maxdepth 1 -type f -name '20x-*-x64.dmg' | head -n 1)"

          test -f "$ZIP_PATH"
          test -f "$DMG_PATH"
          test -f dist/latest-mac.yml

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          ls -lah dist

      # Same check the arm64 build runs on dist/mac/20x.app: the ZIP ships the
      # notarized app as built (not re-zipped), so this only proves the ticket
      # exists and Gatekeeper accepts the app.
      - name: Staple and assess x64 app
        run: |
          APP_DIR="$RUNNER_TEMP/x64-app"
          mkdir -p "$APP_DIR"
          ditto -x -k "${{ steps.mac-artifacts.outputs.zip_path }}" "$APP_DIR"
          test -d "$APP_DIR/20x.app"
          lipo -archs "$APP_DIR/20x.app/Contents/MacOS/20x" || true
          ./scripts/ci-notarize-staple.sh --staple-only "$APP_DIR/20x.app" --assess

      - name: Staple x64 DMG
        run: ./scripts/ci-notarize-staple.sh --staple-only "${{ steps.mac-artifacts.outputs.dmg_path }}"

      - name: Refresh update manifest after stapling
        run: python3 scripts/ci-refresh-mac-manifest.py dist/latest-mac.yml "${{ steps.mac-artifacts.outputs.dmg_path }}"

      - name: Rename arch-specific update manifest
        run: cp dist/latest-mac.yml dist/latest-mac-x64.yml

      - name: Create stable asset names
        run: |
          cp dist/20x-*-x64.dmg dist/20x-mac-x64.dmg
          cp dist/20x-*-x64.zip dist/20x-mac-x64.zip

      - name: Upload release assets directly
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-mac-x64
          path: dist/latest-mac-x64.yml

  build-windows:
    # Pinned to windows-2022: windows-latest ships Visual Studio 18 (VS 2026),
    # which the bundled node-gyp 11.5.0 can't detect, breaking the from-source
    # rebuild of better-sqlite3. windows-2022 has VS 2022 + the C++ workload.
    runs-on: windows-2022
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          TELEMETRY_ENABLED: ${{ vars.TELEMETRY_ENABLED }}
          TELEMETRY_FLUSH_BATCH_SIZE: ${{ vars.TELEMETRY_FLUSH_BATCH_SIZE }}
          TELEMETRY_MAX_BUFFERED_EVENTS: ${{ vars.TELEMETRY_MAX_BUFFERED_EVENTS }}
        run: pnpm build

      - name: Package for Windows
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Create stable asset names
        run: cp dist/*.exe dist/20x-windows-x64.exe

      - name: Upload release assets directly
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-windows-x64
          path: dist/latest.yml

  build-linux:
    runs-on: ubicloud-standard-2
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          TELEMETRY_ENABLED: ${{ vars.TELEMETRY_ENABLED }}
          TELEMETRY_FLUSH_BATCH_SIZE: ${{ vars.TELEMETRY_FLUSH_BATCH_SIZE }}
          TELEMETRY_MAX_BUFFERED_EVENTS: ${{ vars.TELEMETRY_MAX_BUFFERED_EVENTS }}
        run: pnpm build

      - name: Package for Linux
        run: pnpm exec electron-builder --linux --x64 --publish never

      - name: Create stable asset names
        run: cp dist/*.AppImage dist/20x-linux-x86_64.AppImage

      - name: Upload release assets directly
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-linux-x64
          path: dist/latest-linux.yml

  publish-manifests:
    needs: [build-mac, staple-mac-x64, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download manifest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests
          merge-multiple: true

      - name: Merge mac update manifests
        working-directory: manifests
        run: |
          # Combine arm64 + x64 latest-mac manifests into one latest-mac.yml
          if [ -f latest-mac-arm64.yml ] && [ -f latest-mac-x64.yml ]; then
            python3 << 'EOF'
          import re

          def get_files_block(text):
              """Extract indented file entries from under 'files:' key."""
              m = re.search(r"^files:\n((?:  .+\n)+)", text, re.MULTILINE)
              return m.group(1) if m else ""

          arm64 = open("latest-mac-arm64.yml").read()
          x64 = open("latest-mac-x64.yml").read()
          x64_files = get_files_block(x64)

          # Append x64 file entries into arm64's files block
          merged = re.sub(
              r"(^files:\n(?:  .+\n)+)",
              lambda m: m.group(0) + x64_files,
              arm64, count=1, flags=re.MULTILINE
          )
          open("latest-mac.yml", "w").write(merged)
          print("Merged latest-mac.yml")
          EOF
            rm -f latest-mac-arm64.yml latest-mac-x64.yml
          elif [ -f latest-mac-arm64.yml ]; then
            mv latest-mac-arm64.yml latest-mac.yml
          elif [ -f latest-mac-x64.yml ]; then
            mv latest-mac-x64.yml latest-mac.yml
          fi
          echo "--- latest-mac.yml ---"
          cat latest-mac.yml

      - name: Upload manifests to release
        uses: softprops/action-gh-release@v2
        with:
          files: manifests/*.yml
          generate_release_notes: true
